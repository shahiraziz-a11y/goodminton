<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <!-- Goodminton logo: a white G over a court, on a deep-green tile. Same drawing as src/components/AppIcon.tsx. -->
  <defs>
    <radialGradient id="bg" cx="0.28" cy="0.08" r="1.05">
      <stop offset="0" stop-color="#4CB47F"/><stop offset="0.42" stop-color="#17734A"/><stop offset="0.78" stop-color="#0A3E27"/><stop offset="1" stop-color="#062A1A"/>
    </radialGradient>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#D6E6DB"/></linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="9" stdDeviation="7" flood-color="#000" flood-opacity=".35"/></filter>
    <clipPath id="tile"><rect width="200" height="200" rx="46"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="200" height="200" fill="url(#bg)"/>
    <g fill="none" stroke="#fff" stroke-opacity=".3" stroke-width="3">
      <path d="M12 120 H188 L172 206 H28 Z"/>
      <path d="M100 120 V206"/>
      <path d="M18 154 H182"/>
    </g>
    <ellipse cx="102" cy="164" rx="50" ry="8" fill="#000" fill-opacity=".4" filter="url(#soft)"/>
    <path d="M142.4 57.6 A60 60 0 1 0 160 100 H108" fill="none" stroke="url(#g)" stroke-width="20" filter="url(#drop)"/>
    <rect x="1" y="1" width="198" height="198" rx="45" fill="none" stroke="#fff" stroke-opacity=".25" stroke-width="2"/>
  </g>
</svg>
